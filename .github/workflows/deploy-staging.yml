name: CI/CD Staging - Build, Image Docker & Rollback (OPS-04)

# Ce pipeline valide réellement le code (tests + build Next.js + image Docker + sonde de santé
# sur le conteneur démarré). Le déploiement sur un serveur de staging distant est conditionné à
# la présence des secrets STAGING_HOST / STAGING_SSH_KEY : tant que l'infrastructure n'est pas
# provisionnée, cette étape est ignorée (et non simulée).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rollback:
        description: 'Forcer un rollback vers l''image précédente sur le serveur de staging'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  test-and-build:
    name: 1. Tests automatisés & build Next.js
    if: github.event.inputs.force_rollback != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installation reproductible des dépendances
        run: npm ci

      - name: Suite de tests automatisés
        run: npm test

      - name: Build de production Next.js (échec bloquant)
        run: npm run build

  docker-image:
    name: 2. Image Docker & sonde de santé du conteneur
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construction de l'image
        run: docker build -t fnpss-guichet-unique:${{ github.sha }} .

      - name: Démarrage du conteneur candidat
        run: docker run -d --name fnpss-candidate -p 3000:3000 fnpss-guichet-unique:${{ github.sha }}

      - name: Sonde /api/health (10 tentatives)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo ""
              echo "Sonde de santé OK"
              exit 0
            fi
            sleep 3
          done
          echo "Échec de la sonde de santé"
          docker logs fnpss-candidate
          exit 1

      - name: Arrêt du conteneur candidat
        if: always()
        run: docker rm -f fnpss-candidate || true

  deploy-staging:
    name: 3. Déploiement staging (si infrastructure provisionnée)
    needs: docker-image
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
    steps:
      - name: Infrastructure de staging non configurée
        if: env.STAGING_HOST == ''
        run: echo "::notice::Secrets STAGING_HOST / STAGING_SSH_KEY absents - déploiement distant ignoré."

      - name: Déploiement Blue/Green avec rollback automatique
        if: env.STAGING_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/fnpss-staging
            ./deploy.sh ${{ github.sha }} || { echo "Échec - DÉCLENCHEMENT DE LA PROCÉDURE DE ROLLBACK STAGING"; ./rollback.sh; exit 1; }

  manual-rollback:
    name: Rollback manuel staging
    if: github.event.inputs.force_rollback == 'true'
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
    steps:
      - name: Infrastructure de staging non configurée
        if: env.STAGING_HOST == ''
        run: |
          echo "::error::Rollback impossible : secrets STAGING_HOST / STAGING_SSH_KEY absents."
          exit 1

      - name: DÉCLENCHEMENT DE LA PROCÉDURE DE ROLLBACK STAGING
        if: env.STAGING_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: cd /opt/fnpss-staging && ./rollback.sh
